[package]
name = "cln-pricetiers"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Quotes low/medium/high price-ceiling tiers for configured asset pairs -- a standalone pricing policy for assetswap-plugin"
homepage = "https://github.com/liquid-lightning/pricer-plugin"
repository = "https://github.com/liquid-lightning/pricer-plugin"
rust-version = "1.85.0"

[[bin]]
name = "pricetiers-plugin"
path = "src/main.rs"

[dependencies]
anyhow = "1"
log-panics = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

cln-plugin = "0.7"

# A repository of its own, not a member of the CLN workspace (also when a
# build copies it under a CLN checkout).  To build against a CLN checkout's
# crates instead of the published ones:
#   cargo build --config 'patch.crates-io.cln-plugin.path="/path/to/lightning/plugins"' \
#               --config 'patch.crates-io.cln-rpc.path="/path/to/lightning/cln-rpc"'
[workspace]
